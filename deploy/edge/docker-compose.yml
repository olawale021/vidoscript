# Caddy: the only container published to the internet. Routes every stack's
# hostnames over the shared "vidoscript-edge" network and handles HTTPS.
#
#   docker network create vidoscript-edge   # once
#   docker compose -p vidoscript-edge up -d

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
    name: vidoscript-edge
    external: true

volumes:
  caddy_data:
  caddy_config:
