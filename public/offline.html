<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>VidoScript — offline</title>
    <style>
      html, body { height: 100%; margin: 0; background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      p { color: #a3a3a3; max-width: 320px; line-height: 1.5; margin: 0; }
      button { background: #fff; color: #000; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1 style="margin: 0; font-size: 20px">You're offline</h1>
      <p>VidoScript needs an internet connection. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
